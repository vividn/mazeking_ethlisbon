name: Deploy

# Merging to main deploys the frontend to Scaleway Object Storage, fronted by
# Cloudflare. See docs/DEPLOY-HOSTING.md for the one-time bucket + DNS setup
# and the full list of required secrets.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race the bucket. Cancelling an in-flight deploy is
# safe here because each run uploads a complete, self-consistent set of
# assets before it touches index.html.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '9'
  NODE_VERSION: '20'

jobs:
  deploy:
    name: build + publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The deploy credentials are environment-scoped rather than repository-wide.
    # Without this line, `secrets.*` and `vars.*` resolve to empty strings in
    # every step — GitHub does not warn, it simply injects nothing, so the
    # failure surfaces as a missing value rather than a permissions error.
    environment: workflow_env
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap gate (~10s) so a red suite can't reach production. The heavier
      # proof/contract tiers already ran on the PR.
      - name: vitest run
        working-directory: frontend
        run: pnpm test:run

      # Every VITE_* value is INLINED INTO THE BUNDLE and is therefore public
      # in the deployed site. VITE_ALCHEMY_KEY is read from `vars`, not
      # `secrets`, because that is what it is: a value protected by Alchemy's
      # origin allowlist rather than by concealment. Storing it as a secret
      # would mask it in CI logs while it ships in plain sight, which is false
      # confidence. Nothing that must stay private belongs in a VITE_* value.
      #
      # The per-chain URL overrides remain available for cases where a chain
      # needs a different provider; they take precedence over the key.
      - name: Build
        working-directory: frontend
        env:
          VITE_ALCHEMY_KEY: ${{ vars.VITE_ALCHEMY_KEY }}
          VITE_SEPOLIA_RPC_URL: ${{ vars.VITE_SEPOLIA_RPC_URL }}
          VITE_POLYGON_ZKEVM_RPC_URL: ${{ vars.VITE_POLYGON_ZKEVM_RPC_URL }}
        run: pnpm build

      - name: Configure Scaleway S3 credentials
        env:
          SCW_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          SCW_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_ACCESS_KEY }}
          SCW_REGION: ${{ vars.SCW_REGION || secrets.SCW_REGION }}
        run: |
          set -euo pipefail
          hint="set it in the 'workflow_env' environment, and confirm this job still declares environment: workflow_env"
          : "${SCW_ACCESS_KEY_ID:?empty — $hint}"
          : "${SCW_SECRET_ACCESS_KEY:?empty — $hint}"

          # Shape check, not a value dump. A 403 from Object Storage with a
          # correct bucket, region and project usually means the credential
          # itself is malformed — most often a newline picked up when pasting,
          # or the access key and secret key entered the wrong way round.
          # Scaleway access keys are 20 chars beginning "SCW"; secret keys are
          # 36-char UUIDs. Lengths and prefixes are enough to tell.
          echo "access key : ${#SCW_ACCESS_KEY_ID} chars, starts '$(printf %.3s "$SCW_ACCESS_KEY_ID")' (expect 20, 'SCW')"
          echo "secret key : ${#SCW_SECRET_ACCESS_KEY} chars (expect 36, UUID form)"
          case "$SCW_ACCESS_KEY_ID" in
            *[[:space:]]*) echo "::error::SCW_ACCESS_KEY_ID contains whitespace — most likely a trailing newline from pasting. Re-enter it without one." ; exit 1 ;;
          esac
          case "$SCW_SECRET_ACCESS_KEY" in
            *[[:space:]]*) echo "::error::SCW_SECRET_ACCESS_KEY contains whitespace — most likely a trailing newline from pasting. Re-enter it without one." ; exit 1 ;;
          esac
          case "$SCW_ACCESS_KEY_ID" in
            SCW*) : ;;
            *) echo "::warning::Access key does not begin with 'SCW'. If it looks like a UUID, the access key and secret key are swapped." ;;
          esac
          aws configure set aws_access_key_id     "$SCW_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key "$SCW_SECRET_ACCESS_KEY"
          aws configure set default.region        "${SCW_REGION:-fr-par}"

      # The upload needs exactly one capability: PutObject. Test that directly
      # rather than inferring it from listing, which the deploy no longer does.
      # HeadBucket and ListObjectsV2 are both authorised by s3:ListBucket, so
      # requiring either would reintroduce a permission the upload does not use.
      - name: Preflight — verify bucket is writable
        env:
          SCW_BUCKET: ${{ vars.SCW_BUCKET_NAME || vars.SCW_BUCKET || secrets.SCW_BUCKET }}
          SCW_REGION: ${{ vars.SCW_REGION || secrets.SCW_REGION }}
        run: |
          set -uo pipefail
          REGION="${SCW_REGION:-fr-par}"
          ENDPOINT="https://s3.${REGION}.scw.cloud"
          echo "endpoint : ${ENDPOINT}"
          echo "NOTE: if the region above prints as ***, it is stored as a secret."
          echo "      It is not sensitive; storing it as a variable makes it readable here."

          # The bucket must be the bare name ("mazeking"), not the endpoint URL
          # Scaleway shows in its console ("https://mazeking.s3.fr-par.scw.cloud").
          # A hostname passes S3's bucket-name regex, so the CLI accepts it and
          # then reports AccessDenied for a bucket nobody owns — indistinguishable
          # from a permissions problem unless it is checked for explicitly.
          case "$SCW_BUCKET" in
            "")            echo "::error::Bucket name is empty. Expected a variable named SCW_BUCKET_NAME (or SCW_BUCKET) in the workflow_env environment." ; exit 1 ;;
            *://*)         echo "::error::Bucket name looks like a URL ('${SCW_BUCKET}'). Use the bare name only, e.g. 'mazeking'." ; exit 1 ;;
            *.scw.cloud|*.s3.*) echo "::error::Bucket name looks like an endpoint hostname ('${SCW_BUCKET}'). Use the bare name only — for https://mazeking.s3.fr-par.scw.cloud that is 'mazeking'." ; exit 1 ;;
            *[[:space:]]*) echo "::error::Bucket name contains whitespace." ; exit 1 ;;
          esac
          echo "bucket   : '${SCW_BUCKET}'"

          probe() {  # $1 = region -> 0 if the bucket is writable there
            aws s3 cp - "s3://${SCW_BUCKET}/.deploy-preflight" \
              --endpoint-url "https://s3.$1.scw.cloud" >/dev/null 2>&1 <<< ok
          }

          if probe "$REGION"; then
            aws s3 rm "s3://${SCW_BUCKET}/.deploy-preflight" --endpoint-url "$ENDPOINT" >/dev/null 2>&1 || true
            echo "preflight OK — bucket is writable in ${REGION}"
            exit 0
          fi

          # Writing failed. Scaleway answers AccessDenied for a bucket in another
          # region just as it does for a missing permission, so the message alone
          # cannot separate them. Probe the other regions: if one succeeds, the
          # cause is settled and named.
          echo "::group::diagnosis"
          for R in fr-par nl-ams pl-waw; do
            [ "$R" = "$REGION" ] && continue
            if probe "$R"; then
              aws s3 rm "s3://${SCW_BUCKET}/.deploy-preflight" --endpoint-url "https://s3.$R.scw.cloud" >/dev/null 2>&1 || true
              echo "::endgroup::"
              echo "::error::The bucket is writable in region '${R}', not '${REGION}'. Set SCW_REGION to '${R}' — preferably as a repository variable so it is readable in these logs."
              exit 1
            fi
            echo "not writable in $R either"
          done
          echo "--- head-bucket (${REGION}) ---"; aws s3api head-bucket --bucket "$SCW_BUCKET" --endpoint-url "$ENDPOINT" 2>&1 | head -5
          # Decisive split: list-buckets needs a valid credential but no rights
          # on any particular bucket. If it succeeds the credential is good and
          # the problem is bucket-specific; if it fails the credential or its
          # policy scope is at fault, and the bucket is irrelevant.
          echo "--- list-buckets (credential validity, independent of this bucket) ---"
          if LB=$(aws s3api list-buckets --endpoint-url "$ENDPOINT" 2>&1); then
            echo "credential is VALID — these buckets are visible to it:"
            echo "$LB" | grep -oE '"Name": "[^"]+"' | head -20
            echo "::endgroup::"
            echo "::error::The credential works, but '${SCW_BUCKET}' is not writable by it. Compare the name above against SCW_BUCKET_NAME, and confirm the bucket sits in the project this key's policy is scoped to."
            exit 1
          fi
          echo "credential REJECTED for list-buckets as well:"
          echo "$LB" | head -3
          echo "::endgroup::"
          echo "::error::The credential is refused even for listing buckets, so this is not about '${SCW_BUCKET}'. Either the access key and secret key are not from the same key pair (Scaleway shows a secret key only once at creation, so a mismatch is easy to introduce), or the key was deleted or rotated. Generating a fresh API key and re-entering BOTH halves is the quickest resolution."
          exit 1
          echo "::error::Cannot write to '${SCW_BUCKET}' in any Scaleway region. Policies on the key are not the issue if it already carries ObjectStorageFullAccess — check instead that the IAM policy's SCOPE includes the project containing the bucket. Scaleway policies are granted per-project, and a key with full Object Storage rights on project A gets AccessDenied on a bucket in project B. Also confirm the bucket name is exactly right."
          exit 1

      # Upload order is deliberate: assets first, index.html last. index.html
      # names hashed asset files, so publishing it before its assets exist
      # would serve a broken page for the length of the upload.
      #
      # No --delete: old hashed assets are harmless and keep any client
      # holding a cached index.html working. Prune manually if the bucket ever
      # grows inconveniently (see docs/DEPLOY-HOSTING.md).
      - name: Upload hashed assets (immutable)
        env:
          SCW_BUCKET: ${{ vars.SCW_BUCKET_NAME || vars.SCW_BUCKET || secrets.SCW_BUCKET }}
          SCW_REGION: ${{ vars.SCW_REGION || secrets.SCW_REGION }}
        run: |
          set -euo pipefail
          : "${SCW_BUCKET:?empty — set it in the 'workflow_env' environment, and confirm this job declares environment: workflow_env}"
          ENDPOINT="https://s3.${SCW_REGION:-fr-par}.scw.cloud"
          # `cp --recursive`, not `sync`: sync lists the destination to compute a
          # diff, which needs s3:ListBucket. Nothing here benefits from that —
          # assets are content-hashed, so every build writes new names and no
          # comparison is ever meaningful. Dropping sync removes a permission
          # requirement for no loss.
          aws s3 cp frontend/dist "s3://${SCW_BUCKET}" --recursive \
            --endpoint-url "$ENDPOINT" \
            --exclude "index.html" \
            --exclude "*.wasm" \
            --cache-control "public, max-age=31536000, immutable"

      # .wasm needs an explicit content type. Browsers reject
      # WebAssembly.instantiateStreaming on anything but application/wasm, and
      # the CLI's extension guessing cannot be relied on — a wrong type here
      # breaks proof generation at runtime while the page still loads fine.
      - name: Upload WebAssembly with explicit content type
        env:
          SCW_BUCKET: ${{ vars.SCW_BUCKET_NAME || vars.SCW_BUCKET || secrets.SCW_BUCKET }}
          SCW_REGION: ${{ vars.SCW_REGION || secrets.SCW_REGION }}
        run: |
          set -euo pipefail
          ENDPOINT="https://s3.${SCW_REGION:-fr-par}.scw.cloud"
          find frontend/dist -name '*.wasm' -print0 | while IFS= read -r -d '' f; do
            key="${f#frontend/dist/}"
            echo "wasm -> $key"
            aws s3 cp "$f" "s3://${SCW_BUCKET}/${key}" \
              --endpoint-url "$ENDPOINT" \
              --content-type "application/wasm" \
              --cache-control "public, max-age=31536000, immutable"
          done

      # index.html must never be cached at the edge for long: it is the only
      # file that changes name-for-name between deploys, and a stale copy
      # points browsers at asset hashes that may no longer be current.
      - name: Upload index.html (no-cache)
        env:
          SCW_BUCKET: ${{ vars.SCW_BUCKET_NAME || vars.SCW_BUCKET || secrets.SCW_BUCKET }}
          SCW_REGION: ${{ vars.SCW_REGION || secrets.SCW_REGION }}
        run: |
          set -euo pipefail
          ENDPOINT="https://s3.${SCW_REGION:-fr-par}.scw.cloud"
          aws s3 cp frontend/dist/index.html "s3://${SCW_BUCKET}/index.html" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, must-revalidate"

      # The app uses BrowserRouter, so deep links (/gallery, /my-mazes) are
      # served by the bucket as missing keys. Publishing index.html as the
      # error document makes the SPA resolve them client-side.
      - name: Publish SPA fallback (404 -> index.html)
        env:
          SCW_BUCKET: ${{ vars.SCW_BUCKET_NAME || vars.SCW_BUCKET || secrets.SCW_BUCKET }}
          SCW_REGION: ${{ vars.SCW_REGION || secrets.SCW_REGION }}
        run: |
          set -euo pipefail
          ENDPOINT="https://s3.${SCW_REGION:-fr-par}.scw.cloud"
          aws s3 cp frontend/dist/index.html "s3://${SCW_BUCKET}/404.html" \
            --endpoint-url "$ENDPOINT" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache, must-revalidate"

      # Optional. Skipped cleanly when the secrets are absent, so the deploy
      # works before Cloudflare is wired up.
      # The skip is done in-script rather than with `if: secrets.X != ''`,
      # because the `secrets` context is not dependably available in step
      # conditions — a silently-always-false condition would leave a stale
      # edge cache with no visible failure.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ZONE_ID:-}" ]; then
            echo "Cloudflare secrets not set — skipping purge."
            echo "index.html is uploaded no-cache, so a fresh visit still gets the new build."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | tee /dev/stderr | grep -q '"success":true'

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- bundle: $(du -sh frontend/dist | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
